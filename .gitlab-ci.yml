default:
  tags:
    - linux_amd64

stages:
  - build

build:
  stage: build
  image: ubuntu:22.04
  variables:
    DEBIAN_FRONTEND: noninteractive
    CONAN_HOME: "${CI_PROJECT_DIR}/.conan2"
  cache:
    key: conan-cache
    paths:
      - .conan2/
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends build-essential software-properties-common python3 python3-pip ca-certificates
    - add-apt-repository -y ppa:ubuntu-toolchain-r/test
    - apt-get update
    - apt-get install -y --no-install-recommends gcc-13 g++-13
    - update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 100 --slave /usr/bin/g++ g++ /usr/bin/g++-13
    - pip install --no-cache-dir "cmake>=3.30" "conan>=2.0"
    - conan profile detect --force
  script:
    - conan install . --build=missing
    - cmake --preset conan-release
    - cmake --build build/Release
  artifacts:
    paths:
      - build/Release/main/main
    expire_in: 1 week
