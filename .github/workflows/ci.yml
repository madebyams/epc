name: CI

# Converted from the former builds.sr.ht manifest (.build.yml).
# Each sourcehut task is one step; $HOME is the workspace, as on sourcehut.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:stable
    env:
      DEBIAN_FRONTEND: noninteractive
    defaults:
      run:
        shell: bash -xe {0}
    steps:
      - name: Install packages
        run: |
          apt-get update
          apt-get install -y git ca-certificates \
            build-essential \
            gcc-13 \
            g++-13 \
            python3 \
            python3-pip \
            python3-venv \
            ca-certificates

      - uses: actions/checkout@v4
        with:
          path: "epc"
          submodules: recursive
          fetch-depth: 0

      - name: "build"
        run: |
          export HOME="$GITHUB_WORKSPACE"
          cd "$HOME"
          cd epc
          export DEBIAN_FRONTEND=noninteractive
          export CONAN_HOME="$PWD/.conan2"
          mkdir -p .ci-bin
          ln -sf "$(command -v gcc-13)" .ci-bin/gcc
          ln -sf "$(command -v g++-13)" .ci-bin/g++
          export PATH="$HOME/.local/bin:$PWD/.ci-bin:$PATH"
          python3 -m pip install --break-system-packages --no-cache-dir "cmake>=3.30" "conan>=2.0"
          conan profile detect --force
          conan install . --build=missing
          cmake --preset conan-release
          cmake --build build/Release --parallel

      - uses: actions/upload-artifact@v4
        with:
          name: artifacts
          if-no-files-found: warn
          path: |
            epc/build/Release/main/main
